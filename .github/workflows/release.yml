name: release

on:
  push:
    tags: [v*]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a version or prerelease tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"
            exit 1
          fi

  ci:
    name: release-checks
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Linux ${{ matrix.arch }} binary
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build-binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: ./build.sh build
      - name: package-binary
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: tar -czf "wren_${VERSION}_linux_${ARCH}.tar.gz" -C bin wren
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wren-linux-${{ matrix.arch }}
          path: wren_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish-release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wren-linux-*
          path: dist
          merge-multiple: true
      - name: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$VERSION" ./*.tar.gz SHA256SUMS \
            --verify-tag --generate-notes --title "$VERSION" "${flags[@]}"
