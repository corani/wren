  <rect x="778" y="240" width="104" height="4" rx="2" fill="#b1ce9f"/>
  <text x="778" y="270" class="tiny muted">7 of 20 cleared</text>
  <text x="1076" y="270" text-anchor="end" class="tiny muted">HSK 3</text>
  <rect x="792" y="322" width="270" height="358" rx="20" fill="#304132" transform="rotate(3 927 501)"/>
  <rect x="778" y="306" width="298" height="366" rx="20" fill="#243229" stroke="#455441" filter="url(#shadow)"/>
  <rect x="879" y="330" width="96" height="26" rx="13" fill="#344735"/>
  <text x="927" y="348" text-anchor="middle" class="label sage">PINYIN</text>
  <text x="927" y="402" text-anchor="middle" font-size="23" class="muted">xiāngxìn</text>
  <text x="927" y="491" text-anchor="middle" class="chinese" font-size="62">相信</text>
  <text x="927" y="543" text-anchor="middle" font-size="23">to believe; to trust</text>
  <path d="M897 591 H957" stroke="#455441"/>
  <text x="927" y="634" text-anchor="middle" class="tiny muted">Tap to return to the front</text>
  <text x="927" y="715" text-anchor="middle" class="tiny muted">Swipe left for wrong · right for right</text>
  <rect x="778" y="740" width="142" height="50" rx="13" fill="#303a32" stroke="#536152"/>
