  <text x="1153" y="160" class="tiny">9:41</text>
  <rect x="1273" y="143" width="60" height="15" rx="7.5" fill="#344237"/>
  <text x="1453" y="160" text-anchor="end" class="tiny muted">100%</text>
  <text x="1154" y="216" font-family="Georgia, serif" font-size="25">wren</text>
  <rect x="1395" y="195" width="57" height="24" rx="12" fill="#2d3d30"/>
  <text x="1423" y="211" text-anchor="middle" class="tiny sage">Setup</text>
  <text x="1154" y="265" class="heading" style="font-size:27px">A little Chinese, daily.</text>
  <text x="1154" y="292" class="small muted">Choose your focus for this session.</text>

  <text x="1154" y="331" class="label muted">HSK LEVEL</text>
  <rect x="1154" y="343" width="298" height="46" rx="10" fill="#243229" stroke="#455441"/>
  <text x="1170" y="373" class="body">HSK 3</text>
  <path d="M1420 362 l6 6 6-6" fill="none" stroke="#acb8ad" stroke-width="1.5"/>
  <rect x="1154" y="406" width="20" height="20" rx="5" fill="#b1ce9f"/>
  <path d="M1159 415 l4 4 7-8" fill="none" stroke="#17251c" stroke-width="2"/>
  <text x="1185" y="421" class="small">Include lower levels (HSK 1–2)</text>
  <path d="M1154 447 H1452" stroke="#344237"/>

  <text x="1154" y="477" class="label muted">CARD DIRECTIONS</text>
  <rect x="1154" y="492" width="298" height="45" rx="9" fill="#243229" stroke="#455441"/>
  <rect x="1166" y="504" width="20" height="20" rx="5" fill="#b1ce9f"/>
  <path d="M1171 513 l4 4 7-8" fill="none" stroke="#17251c" stroke-width="2"/>
  <text x="1198" y="520" class="small">Read</text>
  <text x="1438" y="520" text-anchor="end" class="tiny muted">Character first</text>
  <rect x="1154" y="544" width="298" height="45" rx="9" fill="#1f2a23" stroke="#455441"/>
