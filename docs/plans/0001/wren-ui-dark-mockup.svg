  <text x="384" y="510" text-anchor="middle" class="chinese" font-size="86">相信</text>
  <text x="384" y="558" text-anchor="middle" class="small muted">Recall the pronunciation and meaning</text>
  <path d="M350 584 H418" stroke="#455441"/>
  <text x="384" y="616" text-anchor="middle" class="tiny muted">Tap card or press Space to flip</text>
