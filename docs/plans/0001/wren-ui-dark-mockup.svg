  <text x="44" y="868" class="label sage">QUIET BY DESIGN</text>
  <text x="44" y="897" class="small muted">Charcoal canvas · green-gray cards · warm white type</text>
  <text x="44" y="924" class="small muted">Forest green actions · neutral retry buttons · sage accents</text>
  <path d="M44 965 H1476" stroke="#344237"/>
  <text x="44" y="994" class="tiny muted">Design study · Follows OS dark appearance · System fonts · No external assets</text>
  <text x="1476" y="994" text-anchor="end" class="tiny muted">Settings stack vertically on mobile; the page scrolls on smaller screens.</text>
</svg>
