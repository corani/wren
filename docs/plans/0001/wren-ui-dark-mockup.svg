  <circle cx="82" cy="154" r="4" fill="#536152"/>
  <circle cx="97" cy="154" r="4" fill="#536152"/>
  <text x="384" y="158" text-anchor="middle" class="tiny muted">wren / practice</text>
  <text x="76" y="224" font-family="Georgia, serif" font-size="25">wren</text>
  <rect x="158" y="202" width="70" height="29" rx="14" fill="#2d3d30"/>
  <text x="193" y="221" text-anchor="middle" class="tiny sage">HSK 3</text>
  <text x="692" y="222" text-anchor="end" class="small muted">End session</text>
  <text x="384" y="286" text-anchor="middle" class="heading">One word at a time.</text>
  <text x="384" y="315" text-anchor="middle" class="small muted">Training · Read, Write &amp; Pinyin · Levels 1–3</text>
