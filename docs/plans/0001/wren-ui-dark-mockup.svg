<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1020" viewBox="0 0 1520 1020" role="img" aria-labelledby="title desc">
  <title id="title">Wren dark mode and vertical mobile settings</title>
  <desc id="desc">Three dark interface mockups: desktop reading practice, a mobile pinyin answer card, and a mobile session setup with vertically stacked settings. Charcoal backgrounds, green-gray cards, warm white text, and sage accents. Illustrative data only.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".22"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #efece2; }
      .muted { fill: #acb8ad; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .label { font-size: 10px; font-weight: 650; letter-spacing: 1.6px; }
      .heading { font-family: Georgia, serif; font-size: 29px; }
      .chinese { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .ink { fill: #17251c; }
      .sage { fill: #b1ce9f; }
    </style>
  </defs>
  <rect width="1520" height="1020" fill="#111815"/>
  <text x="44" y="58" font-family="Georgia, serif" font-size="34">wren</text>
  <text x="138" y="54" class="small muted">A little practice. A lasting memory.</text>
  <text x="1476" y="54" text-anchor="end" class="label muted">UI CONCEPT / 02 / DARK</text>

  <text x="44" y="110" class="label muted">DESKTOP / READING / FRONT</text>
